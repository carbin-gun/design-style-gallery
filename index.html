<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Design Styles Gallery | UI设计风格展览馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <div class="logo-text">
                    <span class="logo-en">Design Styles</span>
                    <span class="logo-zh">设计风格</span>
                </div>
            </div>
            <nav class="nav">
                <span class="nav-count">59 Styles</span>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">All 全部</button>
                    <button class="filter-btn" data-filter="General">General 通用</button>
                    <button class="filter-btn" data-filter="Landing Page">Landing 落地页</button>
                    <button class="filter-btn" data-filter="BI/Analytics">BI 分析</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="hero-title-line">UI Design</span>
                    <span class="hero-title-line accent">Styles Gallery</span>
                </h1>
                <p class="hero-subtitle">
                    探索59种前端设计风格<br>
                    <span class="hero-subtitle-en">Explore 59 Frontend Design Styles</span>
                </p>
            </div>
            <div class="hero-decoration">
                <div class="deco-circle"></div>
                <div class="deco-line"></div>
            </div>
        </section>

        <section class="gallery" id="gallery">
            <!-- Cards will be generated by JavaScript -->
        </section>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <p class="footer-text">UI Design Styles Gallery © 2024</p>
            <p class="footer-credits">59种设计风格 · 完整演示</p>
        </div>
    </footer>

    <script src="js/styles-data.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
